name: Update Spotify Playlists

on:
  schedule:
    - cron: '0 */48 * * *'  # Every 48 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install package
      run: pip install -e .
    
    - name: Run updater
      env:
        SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
        SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
        SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
        SPOTIPY_ACCESS_TOKEN: ${{ secrets.SPOTIPY_ACCESS_TOKEN }}  # Optional
      run: python -m src.main
    
    - name: Commit state files
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add state_*.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update playlist state"
        git push
